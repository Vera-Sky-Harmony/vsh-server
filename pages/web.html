<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vera Sky Harmony</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans JP", sans-serif;
    }

    .web-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
    }

    .image-area {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .web-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
    }


    /* =========================================
       新しい商品画像
       ========================================= */

   .product-overlay {
  position: absolute;
  z-index: 5;
  display: block;
  object-fit: contain;
  border: 0;
  border-radius: 0 !important;
}

    /*
      画像1の商品部分
    */
.product-first {
  left: 41%;
  top: 46%;
  width: 59%;
  height: auto;
}

    /*
      画像4の商品部分
    */
    .product-fourth {
      right: 0%;
      top: 18.5%;
      width: 30%;
      height: 13%;
    }


    /* =========================================
       画像3
       「LINEでVSHを受け取る」を隠す
       ========================================= */

    .hide-line-button {
      position: absolute;
      z-index: 6;

      right: 7%;
      bottom: 4.5%;

      width: 35%;
      height: 5%;

      background: #ffffff;
    }


    /* =========================================
       PC用 QR案内
       ========================================= */

    .pc-qr {
      display: none;
      position: absolute;
      z-index: 20;

      width: 180px;
      padding: 8px;

      background: rgba(255, 255, 255, 0.97);
      border: 2px solid #c99a28;

      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .pc-qr-title {
      margin: 0 0 4px;
      color: #946600;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .pc-qr-text {
      margin: 5px 0 0;
      color: #333333;
      font-size: 10px;
      line-height: 1.4;
    }

    .qr-image {
      display: block;
      width: 105px;
      height: 105px;
      margin: 0 auto;
    }

    /*
      画像1 QR
    */
    .qr-first {
      right: 2%;
      bottom: 2%;
    }

    /*
      画像4 QR
    */
    .qr-fourth {
      left: 2%;
      bottom: 2%;
    }


    /* =========================================
       「VSHともだち追加」クリック領域
       ========================================= */

    .day0-link {
      position: absolute;
      display: block;
      z-index: 15;
      text-decoration: none;
    }

    /*
      画像1 最下部の
      VSHともだち追加
    */
    .day0-link-first {
      left: 53%;
      width: 39%;
      bottom: 0.7%;
      height: 5.8%;
    }

    /*
      画像4 VSHともだち追加
    */
    .day0-link-fourth {
      left: 15%;
      right: 15%;
      bottom: 5%;
      height: 18%;
    }


    /* =========================================
       PC
       ========================================= */

    @media (min-width: 769px) {

      .pc-qr {
        display: block;
      }

      .day0-link {
        cursor: default;
      }
    }


    /* =========================================
       スマートフォン
       ========================================= */

    @media (max-width: 768px) {

      .pc-qr {
        display: none;
      }
    }

  </style>
</head>


<body>

  <main class="web-page">


    <!-- =====================================
         画像1
         ===================================== -->

    <div class="image-area">

      <img
        class="web-image"
        src="/pages/WEB最初の画面.png"
        alt="Vera Sky Harmony"
      >


      <!-- 新しい商品画像 -->
      <img
        class="product-overlay product-first"
        src="/pages/VSH商品画像.png"
        alt="Forever商品"
      >


      <!-- PC用 QR -->
      <div class="pc-qr qr-first">

        <p class="pc-qr-title">
          スマートフォンで<br>
          続けてください
        </p>

        <img
          class="qr-image"
          src="/pages/VSH_Day0_QR.png"
          alt="VSH Day0 QRコード"
        >

        <p class="pc-qr-text">
          QRコードを読み取ると<br>
          Day0が開きます
        </p>

      </div>


      <!-- スマホ用 Day0クリック領域 -->
      <a
        class="day0-link day0-link-first"
        href="/pages/day0.html"
        aria-label="VSHともだち追加"
      ></a>

    </div>



    <!-- =====================================
         画像2
         ===================================== -->

    <img
      class="web-image"
      src="/pages/WEB2番目画像.png"
      alt="Vera Sky Harmony 紹介"
    >



    <!-- =====================================
         画像3
         ===================================== -->

    <div class="image-area">

      <img
        class="web-image"
        src="/pages/WEB3番目画像.png"
        alt="Vera Sky Harmony 仕組み"
      >

      <!--
        WEB紹介ページでは不要な
        「LINEでVSHを受け取る」を隠す
      -->
      <div
        class="hide-line-button"
        aria-hidden="true"
      ></div>

    </div>



    <!-- =====================================
         画像4
         ===================================== -->

    <div class="image-area">

      <img
        class="web-image"
        src="/pages/WEB4番目の4画像.png"
        alt="Vera Sky Harmony"
      >


      <!-- 新しい商品画像 -->
      <img
        class="product-overlay product-fourth"
        src="/pages/VSH商品画像.png"
        alt="Forever商品"
      >


      <!-- PC用 QR -->
      <div class="pc-qr qr-fourth">

        <p class="pc-qr-title">
          スマートフォンで<br>
          始めてください
        </p>

        <img
          class="qr-image"
          src="/pages/VSH_Day0_QR.png"
          alt="VSH Day0 QRコード"
        >

        <p class="pc-qr-text">
          QRコードを読み取ると<br>
          Day0が開きます
        </p>

      </div>


      <!-- スマホ用 Day0クリック領域 -->
      <a
        class="day0-link day0-link-fourth"
        href="/pages/day0.html"
        aria-label="VSHともだち追加"
      ></a>

    </div>

  </main>


  <script>

    const DAY0_URL =
      "https://vsh-server.onrender.com/pages/day0.html";

    const isMobile =
      /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    const day0Links =
      document.querySelectorAll(".day0-link");


    day0Links.forEach(function(link) {

      if (isMobile) {

        /*
          スマートフォン
          画像1・画像4のどちらからでも
          Day0へ進む
        */

        link.href = DAY0_URL;

      } else {

        /*
          PC
          Day0へ直接進ませない
        */

        link.removeAttribute("href");

        link.addEventListener(
          "click",
          function(event) {

            event.preventDefault();

            alert(
              "VSHはスマートフォンからご利用ください。\n\n" +
              "画面に表示されているQRコードをスマートフォンで読み取り、" +
              "Day0からお進みください。"
            );

          }
        );

      }

    });

  </script>

</body>
</html>
