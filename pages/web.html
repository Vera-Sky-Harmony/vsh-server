<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vera Sky Harmony</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans JP", sans-serif;
    }

    .web-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
    }

    .web-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border-radius: 0;
    }

    .image-area,
    .final-area {
      position: relative;
      width: 100%;
    }

    /* ==============================
       PC専用 QRコード案内
       ============================== */

    .pc-qr {
      display: none;
      position: absolute;
      z-index: 20;

      width: 180px;
      padding: 8px;

      background: rgba(255, 255, 255, 0.97);
      border: 2px solid #c99a28;

      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .pc-qr-title {
      margin: 0 0 4px;
      color: #946600;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .pc-qr-text {
      margin: 0 0 5px;
      color: #333333;
      font-size: 10px;
      line-height: 1.4;
    }

    .qr-image {
      display: block;
      width: 105px;
      height: 105px;
      margin: 0 auto;
    }

    /*
      画像1のQRコード
      右下寄り
    */
    .qr-first {
      right: 2%;
      bottom: 2%;
    }

    /*
      画像4のQRコード
      左下寄り
    */
    .qr-final {
      left: 2%;
      bottom: 2%;
    }

    /* ==============================
       画像4 VSHともだち追加
       ============================== */

    .vsh-link {
      position: absolute;
      left: 15%;
      right: 15%;
      bottom: 5%;
      height: 18%;

      display: block;
      cursor: pointer;
      text-decoration: none;
      z-index: 10;
    }

    /* ==============================
       PC
       ============================== */

    @media (min-width: 769px) {

      .pc-qr {
        display: block;
      }

      .vsh-link {
        cursor: default;
      }
    }

    /* ==============================
       スマートフォン
       ============================== */

    @media (max-width: 768px) {

      .pc-qr {
        display: none;
      }
    }

  </style>
</head>

<body>

  <main class="web-page">

    <!-- ==========================
         画像1
         ========================== -->

    <div class="image-area">

      <img
        class="web-image"
        src="/pages/WEB最初の画面.png"
        alt="Vera Sky Harmony"
      >

      <!-- PCのみ表示 -->
      <div class="pc-qr qr-first">

        <p class="pc-qr-title">
          スマートフォンで<br>
          続けてください
        </p>

        <img
          class="qr-image"
          src="/pages/VSH_Day0_QR.png"
          alt="VSH Day0 QRコード"
        >

        <p class="pc-qr-text">
          QRコードを読み取ると<br>
          Day0が開きます
        </p>

      </div>

    </div>


    <!-- ==========================
         画像2
         ========================== -->

    <img
      class="web-image"
      src="/pages/WEB2番目画像.png"
      alt="Vera Sky Harmony 紹介"
    >


    <!-- ==========================
         画像3
         ========================== -->

    <img
      class="web-image"
      src="/pages/WEB3番目画像.png"
      alt="Vera Sky Harmony 仕組み"
    >


    <!-- ==========================
         画像4
         ========================== -->

    <div class="final-area">

      <img
        class="web-image"
        src="/pages/WEB4番目の4画像.png"
        alt="VSHともだち追加"
      >

      <!-- PCのみ表示 -->
      <div class="pc-qr qr-final">

        <p class="pc-qr-title">
          スマートフォンで<br>
          始めてください
        </p>

        <img
          class="qr-image"
          src="/pages/VSH_Day0_QR.png"
          alt="VSH Day0 QRコード"
        >

        <p class="pc-qr-text">
          QRコードを読み取ると<br>
          Day0が開きます
        </p>

      </div>


      <!-- スマホではDay0へ進む -->
      <a
        class="vsh-link"
        id="vshLink"
        href="/pages/day0.html"
        aria-label="VSHともだち追加"
      ></a>

    </div>

  </main>


  <script>

    const DAY0_URL =
      "https://vsh-server.onrender.com/pages/day0.html";

    const isMobile =
      /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    const vshLink =
      document.getElementById("vshLink");


    if (isMobile) {

      /*
        スマートフォン
        今までどおりDay0へ進む
      */

      vshLink.href = DAY0_URL;

    } else {

      /*
        PC
        VSHともだち追加を押しても
        Day0へ直接進ませない
      */

      vshLink.removeAttribute("href");

      vshLink.addEventListener(
        "click",
        function(event) {

          event.preventDefault();

          alert(
            "VSHはスマートフォンからご利用ください。\n\n" +
            "画面に表示されているQRコードをスマートフォンで読み取り、" +
            "Day0からお進みください。"
          );

        }
      );

    }

  </script>

</body>
</html>
