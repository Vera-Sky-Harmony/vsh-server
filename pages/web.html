<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vera Sky Harmony</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans JP", sans-serif;
    }

    .web-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
    }

    .web-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    .final-area {
      position: relative;
      width: 100%;
    }

    .final-area .web-image {
      width: 100%;
    }

    .vsh-link {
      position: absolute;
      left: 15%;
      right: 15%;
      bottom: 5%;
      height: 18%;
      display: block;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="web-page">

    <img
      class="web-image"
      src="/pages/WEB最初の画面.png"
      alt="Vera Sky Harmony"
    >

    <img
      class="web-image"
      src="/pages/WEB2番目画像.png"
      alt="Vera Sky Harmony 紹介"
    >

    <img
      class="web-image"
      src="/pages/WEB3番目画像.png"
      alt="Vera Sky Harmony 仕組み"
    >

    <div class="final-area">

      <img
        class="web-image"
        src="/pages/WEB4番目の4画像.png"
        alt="VSHともだち追加"
      >

      <a
        class="vsh-link"
        href="/pages/day0.html"
        aria-label="VSHともだち追加"
      ></a>

    </div>

  </main>

</body>
</html>
