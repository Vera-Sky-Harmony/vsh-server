<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VSH 仮想スマートフォンテスト</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 520px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            font-size: 22px;
            text-align: center;
        }

        select,
        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            font-size: 16px;
        }

        .notice {
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>
        VSH 仮想スマートフォン<br>
        テストモード
    </h1>

    <label for="virtualDevice">
        仮想スマートフォンを選択
    </label>

    <select id="virtualDevice">
    </select>

    <button id="startButton">
        テストを開始
    </button>

    <div class="notice">
        この画面はVSH動作確認専用です。<br>
        本番利用者の登録には使用しません。
    </div>

</div>

<script>

//----------------------------------
// TEST-001 ～ TEST-200を自動作成
//----------------------------------

const virtualDeviceSelect =
    document.getElementById(
        "virtualDevice"
    );

for (
    let i = 1;
    i <= 200;
    i++
) {

    const number =
        String(i).padStart(
            3,
            "0"
        );

    const option =
        document.createElement(
            "option"
        );

    option.value =
        "TEST-" + number;

    option.textContent =
        "仮想スマホ " + number;

    virtualDeviceSelect.appendChild(
        option
    );
}


//----------------------------------
// テスト開始
//----------------------------------

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        function () {

            const device =
                virtualDeviceSelect.value;

            //----------------------------------
            // 選択した仮想スマホ番号を保存
            //----------------------------------

            sessionStorage.setItem(
                "vshVirtualDevice",
                device
            );

            //----------------------------------
            // LINEへ
            // Day7-2仮想スマホ開始メッセージを渡す
            //----------------------------------

            const message =
                "Day7-2へ進む " +
                device;

            const lineURL =
                "https://line.me/R/oaMessage/@591tvejt/?" +
                encodeURIComponent(
                    message
                );

            window.location.href =
                lineURL;

        }
    );

</script>

</body>
</html>
