<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VSH ルートID管理画面</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="container">

    <h1>
        Vera Sky Harmony<br>
        ルートID管理画面
    </h1>

    <!-- 紹介者情報 -->
    <div class="card">

        <h2>紹介者情報</h2>

        <label>紹介者氏名</label>

        <input
            type="text"
            id="introducerName"
            placeholder="細井 信孝">

        <label>紹介者FLP番号</label>

        <input
            type="text"
            id="introducerFLP"
            placeholder="203145165">

    </div>


    <!-- あなたのFLP番号 -->
    <div class="card">

        <h2>あなたのFLP番号</h2>

        <div id="flpList"></div>

        <div class="buttonArea">

            <button id="saveButton">
                保存
            </button>

        </div>

    </div>


    <!-- VSHともだち追加 -->
    <div class="card">

        <h2>VSHともだち追加</h2>

        <button id="friendButton">
            VSHともだち追加
        </button>

    </div>
<!-- =========================
     既存FBOへDay8直接譲渡
========================== -->

<div class="card">

    <h2>
        既存FBOへVSHを直接譲渡
    </h2>

    <p>
        すでにFBO登録済みの方へ、
        Day8からVSHを直接譲渡します。
    </p>

    <label>
        FBO氏名
    </label>

    <input
        type="text"
        id="directDay8Name"
        placeholder="氏名">

    <label>
        FBO番号
    </label>

    <input
        type="text"
        id="directDay8FLP"
        inputmode="numeric"
        maxlength="9"
        placeholder="9桁のFLP番号">

    <div class="buttonArea">

        <button id="directDay8Button">
            Day8直接譲渡
        </button>

    </div>

    <p>
        ※この機能は、すでにFBOとして
        登録済みの方へのVSH譲渡専用です。
    </p>

</div>

    <!-- 第一世代登録者 -->
    <div class="card">

        <h2>第一世代登録者</h2>

        <p>
            登録人数
            <span id="memberCount">0</span>
            名
        </p>

        <table>

            <thead>

                <tr>

                    <th>氏名</th>

                    <th>FLP番号</th>

                    <th>登録月日</th>

                    <th>ステイタス</th>

                </tr>

            </thead>

            <tbody id="memberTable">
            </tbody>

        </table>

    </div>

</div>

<script src="admin.js"></script>
<script src="invite.js"></script>

</body>

</html>
